<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/menu.css}">
    <link rel="stylesheet" th:href="@{/css/modal.css}">
    <script th:src="@{/js/script.js}" type="text/javascript" defer></script>
    <script th:src="@{/js/copy.js}" type="text/javascript" defer></script>
</head>

<body>

    <!-- Hidden flags: a ruleset/save file was JUST opened (not merely already open). -->
    <!-- Used for the success toasts, so cancelling the file chooser shows nothing.   -->
    <input type="hidden" id="fileOpenedCheck" th:value="${fileOpened}" />
    <input type="hidden" id="savefileOpenedCheck" th:value="${savefileOpened}" />

    <!-- Hidden flag: opened file size differs from the original backup -->
    <input type="hidden" id="sizeMismatchCheck" th:value="${showSizeMismatchModal}" />

    <!-- Hidden flag: the last save attempt failed -->
    <input type="hidden" id="saveErrorCheck" th:value="${saveError}" />

    <!-- Hidden flag: a chosen file couldn't be opened as a valid save -->
    <input type="hidden" id="savefileErrorCheck" th:value="${savefileError}" />

    <nav class="menu-bar">
        <ul class="menu">

            <!-------------------------------------------------------------------------------->
            <!-- Character, item, and ability card menus are inactive unless file is opened -->
            <!-------------------------------------------------------------------------------->

            <!-- File menu fragment -->
            <li th:replace="~{fragments/file-menu-fragment :: file-menu}"></li>

            <!-- Character menu fragment -->
            <li th:replace="~{fragments/character-menu-fragment :: character-menu}"></li>

            <!-- Item menu fragment -->
            <li th:replace="~{fragments/item-menu-fragment :: item-menu}"></li>

            <!-- Ability Card menu fragment -->
            <li th:replace="~{fragments/ability-card-menu-fragment :: ability-card-menu}"></li>

            <!-- More menu fragment-->
            <li th:replace="~{fragments/more-menu-fragment :: more-menu}"></li>
        </ul>
    </nav>

    <!-- Modal and toast fragments-->
    <div th:replace="~{fragments/modal-fragments :: modalFragments}"></div>
    <!-- Edit Items Modal -->
    <div th:replace="~{fragments/edit-items-modal-fragment :: editAllItemsModalFragment}"></div>
    <!-- Edit Cards Modal -->
    <div th:replace="~{fragments/edit-cards-modal-fragment :: editAllCardsModalFragment}"></div>


    <div id="footer">If you encounter any errors or the program doesn't work, place an issue on <a href="#" class="btn"
            style="border: none;"
            onclick="copyToClipboard('https://github.com/Holyfivr/Fivers-Frosthaven-Trainer/')">https://github.com/Holyfivr/Fivers-Frosthaven-Trainer/</a>
    </div>.
    </div>
    <!-- While a save file is open, the contentframe shows the save editor instead of the default page -->
    <iframe id="contentFrame" name="contentFrame" title="contentFrame" th:src="${saveFileLoaded} ? @{/savefile} : @{/how}">

</body>

</html>
