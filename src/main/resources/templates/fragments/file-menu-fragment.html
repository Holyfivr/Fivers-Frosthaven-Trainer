<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

    <li th:fragment="file-menu">
        File
        <ul class="dropdown">
            <!-- sends request to open file endpoint and registers a pending action to notify user when file is loaded -->
            <!-- Ruleset and savefile sessions are mutually exclusive: while one is open, -->
            <!-- opening the other is disabled until the current one is saved/closed.     -->
            <li th:classappend="${saveFileLoaded} ? 'inactive-dropdown'"><a id="openRulesetLink" th:href="@{/open-file}"
                    onclick="registerPendingAction('fileLoaded')">
                    <div>Open Ruleset</div>
                </a></li>
            <li th:classappend="${rulesetLoaded} ? 'inactive-dropdown'"><a id="openSavefileLink"
                    th:href="@{/open-savefile}" onclick="registerPendingAction('savefileLoaded')">
                    <div>Open Savefile</div>
                </a></li>
            <hr>
            <!-- These options are inactive unless a file is loaded -->
            <li th:classappend="${!rulesetLoaded} ? 'inactive-dropdown'"><a id="newBackup"
                    onclick="openModal('backupTemplate')">
                    <div>Create Backup</div>
                </a></li>
            <li th:classappend="${!rulesetLoaded} ? 'inactive-dropdown'">
                <form th:action="@{/restore-backup}" method="POST" style="display:inline;"
                    onsubmit="registerPendingAction('backupRestored')">
                    <button class="restore-btn" type="submit">
                        <div th:classappend="${!rulesetLoaded} ? 'inactive-dropdown'" class="restore-btn">Restore Original</div>
                    </button>
                </form>
            </li>
            <!-- Also disabled while a save file is open, to avoid confusion about which file is being edited -->
            <li th:classappend="${!rulesetLoaded or saveFileLoaded} ? 'inactive-dropdown'"><a id="saveRuleset"
                    onclick="openModal('saveTemplate')">
                    <div>Save Ruleset</div>
                </a></li>
            <!-------------------------------------------------------->
            <hr>
            <li><a th:href="@{/exit}">
                    <div>Exit Program</div>
                </a>
            </li>
        </ul>
    </li>

</body>

</html>
