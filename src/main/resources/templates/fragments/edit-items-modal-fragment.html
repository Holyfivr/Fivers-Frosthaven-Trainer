<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

    <template id="editAllItemsTemplate" th:fragment="editAllItemsModalFragment">
        <form id="editAllItemsForm" method="post" th:action="@{/update-all-items}" target="contentFrame">
            <h2 id="itemModalTitle">Edit All Items</h2>
            <h3>Leave a field blank or enter 0 to ignore</h3>




            <table>
                <tr>
                    <!-- Left column -->
                    <td>
                        <div class="modal-field">
                            <label for="goldCostInput">Gold Cost</label>
                            <input id="goldCostInput" name="setGoldCost" type="number" min="0" max="200" placeholder="1-200" />
                        </div>

                        <div class="modal-field">
                            <label for="damageInput">Damage</label>
                            <input id="damageInput" name="setDamage" type="number" min="0" max="99" placeholder="1-99" />
                        </div>

                        <div class="modal-field">
                            <label for="rangeInput">Range</label>
                            <input id="rangeInput" name="setRange" type="number" min="0" max="99" placeholder="1-99" />
                        </div>

                        <div class="modal-field">
                            <label for="shieldInput">Shield</label>
                            <input id="shieldInput" name="setShield" type="number" min="0" max="99" placeholder="1-99" />
                        </div>

                        <div class="modal-field">
                            <label for="healInput">Heal</label>
                            <input id="healInput" name="setHeal" type="number" min="0" max="99" placeholder="1-99" />
                        </div>
                        <div class="modal-field">
                            <label for="xpInput">XP</label>
                            <input id="xpInput" name="setXP" type="number" min="0" max="99" placeholder="1-99" />
                        </div>
                        <div class="modal-field">
                            <label for="pierceInput">Pierce</label>
                            <input id="pierceInput" name="setPierce" type="number" min="0" max="99" placeholder="1-99">
                        </div>
                    </td>

                    <!-- Right column -->
                    <td>
                        <div class="modal-field">
                            <label for="targetInput">Target</label>
                            <input id="targetInput" name="setTarget" type="number" min="0" max="99" placeholder="1-99" />
                        </div>
                        <div class="modal-field">
                            <label for="retaliateInput">Retaliate</label>
                            <input id="retaliateInput" name="setRetaliate" type="number" min="0" max="99" placeholder="1-99" />
                        </div>

                        <div class="modal-field">
                            <label for="movementInput">Movement</label>
                            <input id="movementInput" name="setMovement" type="number" min="0" max="99" placeholder="1-99" />
                        </div>

                        <div class="modal-field">
                            <label for="totalInGameInput">Total Available</label>
                            <input id="totalInGameInput" name="setTotalInGame" type="number" min="0" max="99"
                                placeholder="1-9" />
                        </div>

                        <div class="modal-field">
                            <label for="prosperityReqInput">Prosperity Requirement</label>
                            <input id="prosperityReqInput" name="setProsperityReq" type="number" min="0" max="99"
                                placeholder="1-9" />
                        </div>

                        <div class="modal-field">
                            <label for="usageInput">Usage</label>
                            <select name="setUsage" id="usageInput">
                                <option value="Unchanged">Unchanged</option>
                                <option value="Spent">Spent</option>
                                <option value="Consumed">Consumed</option>
                                <option value="Unrestricted">Unrestricted
                                </option>
                            </select>
                        </div>

                        <!-- Only affects items with a single, non-'Any' element; 'Any'/array items are left alone -->
                        <div class="modal-field">
                            <label for="consumesInput">Consumes</label>
                            <select name="setConsumes" id="consumesInput">
                                <option value="Unchanged">Unchanged</option>
                                <option value="Air">Air</option>
                                <option value="Dark">Dark</option>
                                <option value="Earth">Earth</option>
                                <option value="Fire">Fire</option>
                                <option value="Ice">Ice</option>
                                <option value="Light">Light</option>
                            </select>
                        </div>

                        <!-- Mass infuse doesn't actually have any working targets,
                        since we intentionally leave out 'Any', and any arrays.
                        Leaving it for future consideration if I rework the way
                        I parse these. -->
<!--                         <div class="modal-field">
                            <label for="infuseInput">Infuse</label>
                            <select name="setInfuse" id="infuseInput">
                                <option value="Unchanged">Unchanged</option>
                                <option value="Air">Air</option>
                                <option value="Dark">Dark</option>
                                <option value="Earth">Earth</option>
                                <option value="Fire">Fire</option>
                                <option value="Ice">Ice</option>
                                <option value="Light">Light</option>
                            </select>
                        </div> -->

                    </td>

                </tr>

            </table>





            <div class="modal-buttons">
                <button type="submit" class="btn">Apply</button>
                <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </template>



</body>

</html>
